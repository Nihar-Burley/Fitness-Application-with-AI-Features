spring:
  application:
    name: userservice
  datasource:
    url: jdbc:mysql://localhost:3306/fitnessapplication?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # other options: none, validate, create, create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        format_sql: true

  server:
    port: 8081